<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>⏩ Ad Speeder</h1>
    <label class="row">Enabled <input type="checkbox" id="enabled" /></label>
    <label class="row"
      >Ad speed
      <select id="speed">
        <option value="2">2×</option>
        <option value="4">4×</option>
        <option value="8">8×</option>
        <option value="16">16× (max)</option>
      </select>
    </label>
    <label class="row">Mute ads <input type="checkbox" id="mute" /></label>
    <label class="row"
      >Auto-click "Skip" <input type="checkbox" id="autoSkip"
    /></label>
    <fieldset class="human">
      <legend
        title="Random speed and sound for each ad, sped up in human-paced steps"
      >
        Act human on
      </legend>
      <label class="row"
        >YouTube <input type="checkbox" id="hz-youtube"
      /></label>
      <label class="row"
        >Prime Video <input type="checkbox" id="hz-prime"
      /></label>
      <label class="row"
        >SonyLIV <input type="checkbox" id="hz-sonyliv"
      /></label>
      <p class="hint">Random speed and volume each ad, ramped up gradually.</p>
    </fieldset>
    <div class="stats">
      Ads fast-forwarded: <b id="ads">0</b><br />
      Time saved: <b id="saved">0s</b><br />
      Skips clicked: <b id="skips">0</b><br />
      <button id="reset">Reset stats</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
